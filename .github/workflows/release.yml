# Publishes to npm via OIDC "trusted publishing" — no long-lived npm token,
# and npm generates provenance attestations automatically, so consumers can
# verify the package was built from this repo by this workflow.
#
# One-time setup required on npmjs.com (package Settings -> Publishing access
# -> Trusted publisher): select GitHub Actions, repository
# IndigoProtocol/indigo-sdk, workflow file release.yml. Until that is
# configured, this workflow will fail at the publish step.
#
# Release process:
#   1. bump "version" in package.json on main (via PR)
#   2. git tag v<version> && git push origin v<version>
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1 (Node 24 ships an older npm)
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      # "prepublishOnly" runs the build, so the published dist/ is always
      # freshly built from the tagged commit — never a stale local artifact.
      - name: Publish to npm
        run: npm publish
